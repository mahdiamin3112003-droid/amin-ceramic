name: Keep the embedding model warm

# ── Why this lives in GitHub Actions and not vercel.json ──
# It started as a Vercel cron. Vercel rejects the deploy outright on the
# Hobby plan: "Hobby accounts are limited to daily cron jobs." A daily ping
# warms nothing — Replicate evicts an idle model within minutes — so the
# choice was a scheduler that can actually run every ten minutes, or a job
# that looks like a keep-warm and is not one.
#
# ── What this buys, measured ──
# Real embedding calls: min 1.6s warm, median 9.1s, p90 212s, worst 234.9s.
# Replicate scales to zero on inactivity, so a LOW-traffic feature meets a
# cold model most of the time — cold starts are the norm here, not the tail.
# No visitor waits four minutes for a tile match.
#
# ── Its known weakness, stated rather than discovered ──
# GitHub's scheduled workflows are best-effort: runs are delayed under load
# and can be skipped entirely. This is therefore a keep-warm, not a warmth
# guarantee, which is why the query path still degrades honestly instead of
# assuming the model is up. Accepted deliberately while the Tile Finder is
# behind TILE_FINDER_ENABLED; if the real numbers show too many misses, the
# fallback is Vercel Pro and a `crons` entry, with no application change.

on:
  schedule:
    # Every ten minutes. GitHub treats this as "no sooner than", not "at".
    - cron: "*/10 * * * *"
  # So the endpoint can be exercised on demand — proving it works should not
  # require waiting for a tick.
  workflow_dispatch:

# One ping at a time. A queued backlog of warm-ups would spend Replicate
# credit to no purpose, since warmth is not cumulative.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  warm:
    name: ping the warm-up endpoint
    runs-on: ubuntu-latest
    # A stuck curl must not hold a runner for six hours.
    timeout-minutes: 5

    steps:
      - name: Ping
        env:
          # Repository secrets. CRON_SECRET must match the value Vercel holds;
          # the endpoint 401s otherwise, which is the intended behaviour for
          # anyone who finds the URL.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://amin-ceramic.vercel.app' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set on this repository."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "It must match the CRON_SECRET set on Vercel."
            exit 1
          fi

          # --max-time, not --connect-timeout: the route queues the Replicate
          # prediction and returns immediately (a blocking warm-up would
          # outlive the function it runs in), so a slow response here means
          # something is wrong rather than merely cold.
          status=$(curl -sS -o /tmp/warm.out -w '%{http_code}' \
            --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/warm-embedding")

          echo "HTTP ${status}"
          # The body carries no secrets — it reports whether a prediction was
          # queued — so printing it makes a failed tick diagnosable.
          cat /tmp/warm.out || true
          echo

          if [ "${status}" != "200" ]; then
            echo "::error::Warm-up ping failed with HTTP ${status}."
            exit 1
          fi
